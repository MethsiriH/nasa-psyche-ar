<!DOCTYPE html>
<html>
<head>
  <title>AR.js Setup: Area Learner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
   .ui-panel {
      position: absolute; 
      top: 15px; 
      width: 100%;
      text-align: center; 
      z-index: 1000; 
      font-family: sans-serif;
    }
    button { 
      padding: 12px 20px; 
      font-size: 16px; 
      margin: 5px; 
      cursor: pointer;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #status { 
      background: rgba(255, 255, 255, 0.9); 
      display: inline-block; 
      padding: 10px; 
      border-radius: 5px; 
      font-weight: bold; 
      margin-top: 10px;
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">
  
  <div class="ui-panel">
    <button id="start-learning">1. Start Learning</button>
    <button id="save-learning" disabled>2. Save Configuration</button>
    <br/>
    <div id="status">Waiting for AR engine to load...</div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const statusDiv = document.getElementById('status');
    const updateStatus = (msg) => { statusDiv.innerText = msg; };
    const sceneEl = document.querySelector('a-scene');

    const initLearner = () => {
      let attempts = 0;
      // Poll until the AR engine context is completely ready
      const checkAndInit = () => {
        attempts++;
        try {
            const arjsSys = sceneEl.systems['arjs'];
            const arSession = arjsSys ? arjsSys._arSession : null;
            if (!arSession || !arSession.arContext) {
                updateStatus("Waiting for AR engine... (" + attempts + ")");
                setTimeout(checkAndInit, 500);
                return;
            }

            const arToolkitContext = arSession.arContext;
            const threeScene = sceneEl.object3D;

            // 1. Define the 8 barcode markers (IDs 0 through 7)
            const markersControlsParameters = [];
            for (let i = 0; i < 8; i++) {
              markersControlsParameters.push({ type: 'barcode', barcodeValue: i });
            }

            // 2. Initialize AR.js Marker Controls for each of the 8 barcodes
            const subMarkersControls = [];
            markersControlsParameters.forEach((markerParams) => {
              const markerRoot = new THREE.Group();
              threeScene.add(markerRoot);
              const markerControls = new THREEx.ArMarkerControls(arToolkitContext, markerRoot, markerParams);
              subMarkersControls.push(markerControls);
            });

            // 3. Initialize the Multi-Marker Area Learning Engine
            if (typeof THREEx.ArMultiMakersLearning === 'undefined' && typeof THREEx.ArMultiMarkerLearning !== 'undefined') {
                THREEx.ArMultiMakersLearning = THREEx.ArMultiMarkerLearning; // handle typo
            }
            if (typeof THREEx.ArMultiMakersLearning === 'undefined') {
                updateStatus("Error: ArMultiMakersLearning is missing from AR.js build!");
                return;
            }
            const multiMarkerLearning = new THREEx.ArMultiMakersLearning(arToolkitContext, subMarkersControls);

            updateStatus("Ready. Point camera at the physical setup and click 'Start'.");

            // 4. Handle 'Start Learning' Button
            document.getElementById('start-learning').addEventListener('click', () => {
              multiMarkerLearning.resetStats();
              multiMarkerLearning.enabled = true;
              
              updateStatus("Learning... Pan the camera slowly to view multiple markers at once.");
              document.getElementById('save-learning').disabled = false;
            });

            // 5. Handle 'Save Configuration' Button
            document.getElementById('save-learning').addEventListener('click', () => {
              multiMarkerLearning.enabled = false;
              
              // Generate the JSON string of the physical layout
              const jsonString = multiMarkerLearning.toJSON();

              // Save the layout to the browser's local storage so the game page can find it
              localStorage.setItem('ARjsMultiMarkerFile', jsonString);

              updateStatus("Area Saved! You can now open your main game page.");
            });
        } catch (e) {
            updateStatus("Crash: " + e.message);
        }
      };
      
      checkAndInit();
    };

    // Immediately start polling, bypass a-scene loaded event flakiness
    initLearner();
  </script>
</body>
</html>
