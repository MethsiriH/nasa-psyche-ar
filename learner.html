<!DOCTYPE html>
<html>
<head>
  <title>AR.js Setup: Area Learner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
   .ui-panel {
      position: absolute; 
      top: 15px; 
      width: 100%;
      text-align: center; 
      z-index: 1000; 
      font-family: sans-serif;
    }
    button { 
      padding: 12px 20px; 
      font-size: 16px; 
      margin: 5px; 
      cursor: pointer;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #status { 
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85); 
      color: white;
      padding: 20px; 
      border-radius: 12px; 
      font-size: 22px;
      font-weight: bold; 
      text-align: center;
      width: 80%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 2000;
      pointer-events: none;
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">
  
  <div class="ui-panel">
    <button id="start-learning">1. Start Learning</button>
    <button id="save-learning" disabled>2. Save Configuration</button>
    <br/>
    <div id="status">Waiting for AR engine to load...</div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">
    <a-marker type="barcode" value="0" id="marker-0"></a-marker>
    <a-marker type="barcode" value="1" id="marker-1"></a-marker>
    <a-marker type="barcode" value="2" id="marker-2"></a-marker>
    <a-marker type="barcode" value="3" id="marker-3"></a-marker>
    <a-marker type="barcode" value="4" id="marker-4"></a-marker>
    <a-marker type="barcode" value="5" id="marker-5"></a-marker>
    <a-marker type="barcode" value="6" id="marker-6"></a-marker>
    <a-marker type="barcode" value="7" id="marker-7"></a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const statusDiv = document.getElementById('status');
    const updateStatus = (msg) => { statusDiv.innerText = msg; };
    
    let learningMode = false;
    let loopId = null;
    const THREE = window.THREE;
    const knownMarkers = { 0: new THREE.Matrix4().identity() };

    updateStatus("Ready! Point camera at Marker 0 to start anchor, then hit 'Start Learning'.");

    const pollTracking = () => {
        if (!learningMode) return;
        loopId = requestAnimationFrame(pollTracking);
        
        // Find which markers are currently tracked
        const visibleMarkers = [];
        for(let i=0; i<8; i++){
            const el = document.getElementById('marker-'+i);
            if(el && el.object3D.visible) {
                visibleMarkers.push({ id: i, mat: el.object3D.matrixWorld.clone() });
            }
        }

        if(visibleMarkers.length < 2 && Object.keys(knownMarkers).length === 1 && !visibleMarkers.find(v => v.id===0)) {
           // We only know marker 0, and we either see 0 or 1 marker. Do nothing.
           return; 
        }

        // Find a visible marker whose mapping to Marker 0 is ALREADY KNOWN
        const knownVisible = visibleMarkers.find(m => knownMarkers[m.id] !== undefined);
        if(knownVisible) {
            // We know this marker's true offset relative to root (Marker 0)
            const rootToKnown = knownMarkers[knownVisible.id]; 
            
            // Map any UNKNOWN visible markers to the Root
            visibleMarkers.forEach(m => {
                if (knownMarkers[m.id] === undefined) {
                    // Calculate spatial offset from the Known marker to this Unknown marker
                    const knownInverse = new THREE.Matrix4().copy(knownVisible.mat).invert();
                    const offsetFromKnown = new THREE.Matrix4().copy(knownInverse).multiply(m.mat);
                    
                    // Root -> Unknown = (Root -> Known) * (Known -> Unknown)
                    const rootToUnknown = new THREE.Matrix4().copy(rootToKnown).multiply(offsetFromKnown);
                    knownMarkers[m.id] = rootToUnknown;
                }
            });
        }
        
        const count = Object.keys(knownMarkers).length;
        if (count === 8) {
            updateStatus(`Success! Mapped all 8 markers! Hit Save Configuration.`);
        } else {
            updateStatus(`Learning... Mapped ${count} / 8 markers. Pan to view unknown markers alongside mapped ones.`);
        }
    };

    document.getElementById('start-learning').addEventListener('click', () => {
        learningMode = true;
        document.getElementById('save-learning').disabled = false;
        loopId = requestAnimationFrame(pollTracking);
    });

    document.getElementById('save-learning').addEventListener('click', () => {
        learningMode = false;
        if (loopId) cancelAnimationFrame(loopId);
        
        // Format as expected by AR.js Multi-Marker Area component
        const subMarkersControls = [];
        for (let i = 0; i < 8; i++) {
            if (knownMarkers[i]) {
                subMarkersControls.push({
                    parameters: { type: 'barcode', barcodeValue: i },
                    poseMatrix: Array.from(knownMarkers[i].elements)
                });
            }
        }
        
        const areaConfig = { subMarkersControls };
        const jsonString = JSON.stringify(areaConfig);
        
        localStorage.setItem('ARjsMultiMarkerFile', jsonString);
        updateStatus("Area configuration SAVED to browser! You can now open your main game page.");
        console.log("Multi-Marker Map Saved:", jsonString);
    });
  </script>
</body>
</html>
