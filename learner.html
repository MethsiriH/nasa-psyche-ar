<!DOCTYPE html>
<html>
<head>
  <title>AR.js Setup: Area Learner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
   .ui-panel {
      position: absolute; 
      top: 15px; 
      width: 100%;
      text-align: center; 
      z-index: 1000; 
      font-family: sans-serif;
    }
    button { 
      padding: 12px 20px; 
      font-size: 16px; 
      margin: 5px; 
      cursor: pointer;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #status { 
      background: rgba(255, 255, 255, 0.9); 
      display: inline-block; 
      padding: 10px; 
      border-radius: 5px; 
      font-weight: bold; 
      margin-top: 10px;
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">
  
  <div class="ui-panel">
    <button id="start-learning">1. Start Learning</button>
    <button id="save-learning" disabled>2. Save Configuration</button>
    <br/>
    <div id="status">Waiting for AR engine to load...</div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');

    const initLearner = () => {
      // Poll until the AR engine context is completely ready
      const checkAndInit = () => {
        if (!sceneEl.systems || !sceneEl.systems['arjs'] || !sceneEl.systems['arjs'].arToolkitContext) {
          setTimeout(checkAndInit, 500);
          return;
        }

        const arToolkitContext = sceneEl.systems['arjs'].arToolkitContext;
        const threeScene = sceneEl.object3D;

        // 1. Define the 8 barcode markers (IDs 0 through 7)
        const markersControlsParameters = [];
        for (let i = 0; i < 8; i++) {
          markersControlsParameters.push({ type: 'barcode', barcodeValue: i });
        }

        // 2. Initialize AR.js Marker Controls for each of the 8 barcodes
        const subMarkersControls = [];
        markersControlsParameters.forEach((markerParams) => {
          const markerRoot = new THREE.Group();
          threeScene.add(markerRoot);
          const markerControls = new THREEx.ArMarkerControls(arToolkitContext, markerRoot, markerParams);
          subMarkersControls.push(markerControls);
        });

        // 3. Initialize the Multi-Marker Area Learning Engine
        // AR.js historically had a typo matching this object name: "ArMultiMakersLearning"
        const multiMarkerLearning = new THREEx.ArMultiMakersLearning(arToolkitContext, subMarkersControls);

        document.getElementById('status').innerText = "Ready. Point camera at the physical setup and click 'Start'.";

        // 4. Handle 'Start Learning' Button
        document.getElementById('start-learning').addEventListener('click', () => {
          multiMarkerLearning.resetStats();
          multiMarkerLearning.enabled = true;
          
          document.getElementById('status').innerText = "Learning... Pan the camera slowly to view multiple markers at once.";
          document.getElementById('save-learning').disabled = false;
        });

        // 5. Handle 'Save Configuration' Button
        document.getElementById('save-learning').addEventListener('click', () => {
          multiMarkerLearning.enabled = false;
          
          // Generate the JSON string of the physical layout
          const jsonString = multiMarkerLearning.toJSON();

          // Save the layout to the browser's local storage so the game page can find it
          localStorage.setItem('ARjsMultiMarkerFile', jsonString);

          document.getElementById('status').innerText = "Area Saved! You can now open your main game page.";
          console.log("Multi-Marker Map Saved:", jsonString);
        });
      };
      
      checkAndInit();
    };

    if (sceneEl.hasLoaded) {
      initLearner();
    } else {
      sceneEl.addEventListener('loaded', initLearner);
    }
  </script>
</body>
</html>
